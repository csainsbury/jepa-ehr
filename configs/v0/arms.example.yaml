# Clinical-JEPA v0 arms config example
# Copy to arms.yaml and replace placeholders only after human approval.
# Paths are placeholders and must not contain credentials or real patient-level data.

schema_version: clinical-jepa-arms-config-v0

common:
  target_blocks:
    T0:
      enabled: true
      event_count_window: 32          # event-index mode (default extractor unit)
      time_window_hours: 24
      require_context_before_target: true
      # Wall-clock mode (extract_blocks --unit wall_clock; Pi spec 2026-07-05,
      # rung0_1_run_specs.md "Wall-clock target-block definition"). Target = the
      # half-open interval [t_query, t_query + window_days) over cumulative_days,
      # with t_query = cumulative_days at context end + gap_days (scheduled).
      # Source-specific windows are allowed for YIELD; the cross-source hierarchy
      # claim (rung 0) is made only at the shared common_horizons_days.
      wall_clock:
        window_days: 90
        gap_days: 0
        common_horizons_days: [30, 90, 180]
      # Per-source overrides live at the T0 level (not inside wall_clock): MIMIC
      # is per-admission + short -> a narrower window (documented so it is not
      # silently dropped); SCI-D is long. `min_context` is read at the source
      # level; the wall-clock window/gap under each source's `wall_clock`.
      per_source:
        MIMIC: {min_context: 4, wall_clock: {window_days: 7}}
        SCID: {min_context: 8, wall_clock: {window_days: 90}}
    T1:
      enabled: true
      medication_family_mapping_path: /PLACEHOLDER/safe/config/medication_families.yaml
      anchors: [new_start, switch]
      target_window_hours: 72
    T2:
      enabled: false
      reason: prefix-safe endpoint labels not yet confirmed
  horizons:
    - name: short
      hours: 24
    - name: medium
      hours: 72
    - name: long
      days: 30
  max_windows_per_patient:
    train: 32
    dev: 16
    test: 16

v0A_flatascend_scaffold:
  enabled: false
  requires_human_approval_before_execution: true
  checkpoint_path: /PLACEHOLDER/approved/flatascend/checkpoint
  tokenizer_path: /PLACEHOLDER/approved/flatascend/tokenizer
  prefix_only_embeddings: true
  target_layers: [shallow, mid, final]
  pooling: [mean, attention]
  predictors:
    - linear
    - mlp
  ablations:
    horizon_descriptor: [present, absent]

v0B_minimal_jepa:
  enabled: false
  requires_human_approval_before_execution: true
  token_embedding_dim: 128
  time_embedding_dim: 32
  encoder_type: small_transformer
  context_encoder:
    layers: 2
    heads: 4
    hidden_dim: 256
  target_encoder:
    ema_decay: 0.996
    stop_gradient: true
  predictor:
    layers: 2
    hidden_dim: 256
    use_horizon_descriptor: true
  losses:
    latent_prediction: cosine_or_mse_placeholder
    variance_regularization_weight: 1.0
    covariance_regularization_weight: 0.04
  training:
    batch_size: 128
    max_steps: 1000
    learning_rate: 0.0003
    dry_run_steps: 2

v0C_raw_meds_lite:
  enabled: false
  requires_explicit_raw_lite_approval: true
  status: gated
  minimal_schema_only: true

v0D_query_baseline:
  enabled: false
  requires_human_approval_before_execution: true
  query_descriptors:
    - query_id: next_med_family
      target_type: T0
      task_type: multiclass
    - query_id: next_lab_direction
      target_type: T0
      task_type: multiclass
    - query_id: medication_change_followup
      target_type: T1
      task_type: binary_or_multiclass
    - query_id: mortality_or_shock_onset
      target_type: T2
      task_type: binary
      enabled: false
      reason: T2 prefix-safe labels not confirmed
  models:
    - empirical_prior
    - bag_count_time
    - utilisation_intensity
    - logistic_or_linear_probe

safety:
  require_passing_leakage_audit: true
  no_patient_level_logging: true
  no_external_upload: true
